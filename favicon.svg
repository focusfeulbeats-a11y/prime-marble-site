<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .marble { fill: #0c0c0c; }
    .accent { fill: #ff6a00; }
  </style>
  <!-- Background -->
  <rect width="100" height="100" class="marble"/>
  <!-- Geometric marble design -->
  <circle cx="50" cy="50" r="30" class="marble" fill="none" stroke="#ff6a00" stroke-width="4"/>
  <rect x="35" y="35" width="30" height="30" class="accent" opacity="0.8"/>
  <polygon points="50,20 70,80 30,80" class="accent" opacity="0.6"/>
</svg>